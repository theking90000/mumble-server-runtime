[package]
name = "mumble-server-runtime-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Codec pur du protocole Mumble : framing TCP, messages protobuf, enveloppes UDP. Sans IO ni runtime (R4)."

[lib]
name = "mumble_server_runtime_protocol"
path = "src/mumble_server_runtime_protocol.rs"

[dependencies]
thiserror = "2"
prost = "0.13"

[build-dependencies]
# Generate message types from the vendored .proto (R1). `protox` is a pure-Rust
# protobuf compiler, so the build needs no external `protoc` and stays hermetic
# in CI.
prost-build = "0.13"
protox = "0.7"

[lints]
workspace = true
