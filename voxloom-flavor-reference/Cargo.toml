[package]
name = "voxloom-flavor-reference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Deterministic Aurora/Borealis reference flavor, built only on the public Voxloom flavor contract."

[lib]
name = "voxloom_flavor_reference"
path = "src/voxloom_flavor_reference.rs"

[dependencies]
voxloom-flavor = { path = "../voxloom-flavor" }

[dev-dependencies]
# The control plane is used as a verifier here: a reference flavor whose
# outputs do not pass the runtime's own validation would be worthless. The
# dependency runs flavor -> control, never the reverse.
voxloom-control = { path = "../voxloom-control" }

[lints]
workspace = true
