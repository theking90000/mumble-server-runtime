[package]
name = "voxloom-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Minimal Mumble-compatible server (Phase 3) : accept TLS, handshake (Version/Authenticate stub/CryptSetup/ServerSync/ServerConfig), UDP crypto association, ping, audio loopback and TCP tunnel fallback. Speaks the wire via voxloom-protocol + voxloom-crypto."

# lib + bin : the connection state machine, the pure handshake builder and the
# voice plane live in the lib so they are testable in integration; the bin is a
# thin CLI wiring.
[lib]
name = "voxloom_server"
path = "src/voxloom_server.rs"

[[bin]]
name = "voxloom-server"
path = "src/main.rs"

[dependencies]
voxloom-protocol = { path = "../voxloom-protocol" }
voxloom-crypto = { path = "../voxloom-crypto" }
voxloom-audio = { path = "../voxloom-audio" }
voxloom-render = { path = "../voxloom-render" }
voxloom-reconcile = { path = "../voxloom-reconcile" }
voxloom-session = { path = "../voxloom-session" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
# ring : source of randomness (SystemRandom) for the per-connection OCB2 key and
# nonces sent in CryptSetup. Already in the tree via the rustls provider.
ring = "0.17"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "net", "sync"] }
# The integration test drives the server as a real TLS client, exercising the
# codec both ways on live traffic.
voxloom-protocol = { path = "../voxloom-protocol" }
voxloom-crypto = { path = "../voxloom-crypto" }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[lints]
workspace = true
