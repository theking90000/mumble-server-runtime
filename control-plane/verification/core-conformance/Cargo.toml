[package]
name = "mumble-controller-core-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Independent synchronization conformance scenarios for the Mumble Controller"
publish = false

[lib]
name = "mumble_controller_core_conformance"
path = "src/mumble_controller_core_conformance.rs"

[dependencies]
prost = "=0.14.4"
prost-types = "=0.14.4"
tonic = { version = "=0.14.6", features = ["transport"] }
tonic-prost = "=0.14.6"

[dev-dependencies]
mumble-controller-server = { path = "../../server-rust" }
mumble-server-runtime-gateway = { path = "../../../runtime/crates/gateway" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"

[build-dependencies]
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
tonic-prost-build = "=0.14.6"

[lints]
workspace = true
