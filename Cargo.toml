# Workspace Voxloom — manifeste virtuel.
#
# Phase 0 : le workspace est VIDE (aucun membre). Conformément à la règle R5 de
# la roadmap, un crate n'existe que lorsqu'une phase le remplit. Les crates de la
# spec §7.1 (voxloom-protocol, voxloom-crypto, voxloom-transport, voxloom-session,
# voxloom-auth, voxloom-state, voxloom-render, voxloom-reconcile, voxloom-audio,
# voxloom-control, voxloom-observe, voxloom-testkit) seront ajoutés ici au fil des
# phases, pas avant.
[workspace]
resolver = "3"
members = [
    # Outil de Phase 0 : proxy d'enregistrement du corpus (livrable P0 #3).
    # Ce n'est PAS un crate de domaine (voir R5) : c'est le binaire démontrable
    # de la Phase 0, il vit sous tools/.
    "tools/recording-proxy",
    # Phase 1 : critère de « done » — décodeur de corpus (transcript lisible,
    # aucun octet inexpliqué). Binaire de vérification sous tools/ (R5), dépend
    # des crates purs sans jamais l'inverse (R4).
    "tools/corpus-decode",
    # Phase 2 : proxy MITM oracle. Termine la TLS des deux côtés, décode/ré-encode
    # chaque message de contrôle (le codec exercé sur du trafic vivant), et ré-écrit
    # l'échange de clés OCB2 pour tenir un domaine crypto indépendant vers chaque
    # bord. Outil sous tools/ (R5), dépend des crates purs.
    "tools/mitm-proxy",
    # Phase 1 : codec pur (framing TCP, protobuf, enveloppes UDP).
    "voxloom-protocol",
    # Phase 1 : crypto pure (OCB2-AES128, nonces, anti-rejeu).
    "voxloom-crypto",
    # Phase 5 : moteur de vues pur — types de vue normalisée + validation des
    # invariants §20. Sans IO, sans wire format (gate render/no-protocol).
    "voxloom-render",
    # Phase 5 : réconciliation pure — diff logique (§12.4), planificateur de
    # transitions (§12.5/§12.6), résolution clé→ID stable (ADR-007). Dépend
    # uniquement des types de vue de voxloom-render.
    "voxloom-reconcile",
    # Phase 4 : routage audio pur — compilation du snapshot de routage (§15.3),
    # politique directionnelle (§15.4), réécriture d'enveloppe (§15.2). Hot path
    # d'ADR-005 : ni verrou, ni await, ni accès à l'état vivant (gates R4).
    "voxloom-audio",
    # Phase 6 : cycle de vie de la vue d'une connexion — vue engagée, résolution
    # clé→ID stable (ADR-007), traduction du plan abstrait en messages de
    # contrôle, et règle de commit atomique (§12.7, invariant 20). Crate pur :
    # ni runtime, ni socket, ni file d'attente.
    "voxloom-session",
    # Phase 3 : serveur minimal — accepte la TLS, déroule le handshake sans
    # Murmur, associe l'UDP par preuve cryptographique, répond aux pings et
    # réfléchit l'audio de loopback (target 31). Dépend des crates purs P1.
    "voxloom-server",
    # Phase 3 : testkit vérificateur — SimulatedMumbleClient, modèle strict qui
    # applique les messages serveur et panique sur toute violation §20. Zone
    # vérificateur (R2) : jamais dans le même diff qu'un voxloom-*/src.
    "voxloom-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"
repository = "https://github.com/theking90000/voxloom"
authors = ["Voxloom contributors"]

# Lints partagés — encodent une partie de R4 au niveau du compilateur. Chaque
# crate futur les active via `[lints] workspace = true`. Le reste de R4 (règles
# par-crate : Mutex/await dans voxloom-audio, imports interdits, etc.) est appliqué
# par les gates grep de ci/gates.sh, car clippy ne peut pas les exprimer.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
# `expect_used` reste autorisé (message explicite) mais surveillé.
expect_used = "warn"
todo = "deny"
unimplemented = "deny"
