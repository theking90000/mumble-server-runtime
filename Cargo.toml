# Workspace Voxloom — runtime vocal declaratif compatible Mumble.
[workspace]
resolver = "3"
members = [
    # Outils d'observation et de verification du protocole.
    "tools/recording-proxy",
    "tools/corpus-decode",
    "tools/mitm-proxy",
    # Fondations pures.
    "voxloom-protocol",
    "voxloom-crypto",
    # Runtime courant : logique de shard sans IO, puis gateway TLS/TCP/UDP.
    "voxloom-shard",
    "voxloom-gateway",
    # Composition et charge de demonstration.
    "tools/voxloom-arena",
    "tools/voxloom-stress",
    "tools/bench-shard",
    # Verificateur indépendant : client Mumble simule et modele strict.
    "voxloom-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"
repository = "https://github.com/theking90000/voxloom"
authors = ["Voxloom contributors"]

# Lints partagés — encodent une partie de R4 au niveau du compilateur. Chaque
# crate les active via `[lints] workspace = true`. Le reste de R4 est applique
# par les gates de `ci/`, car clippy ne peut pas l'exprimer.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
# `expect_used` reste autorisé (message explicite) mais surveillé.
expect_used = "warn"
todo = "deny"
unimplemented = "deny"
