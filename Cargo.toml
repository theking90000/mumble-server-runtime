# Workspace Mumble Server Runtime — runtime vocal declaratif compatible Mumble.
[workspace]
resolver = "3"
members = [
    # Outils d'observation et de verification du protocole.
    "tools/recording-proxy",
    "tools/corpus-decode",
    "tools/mitm-proxy",
    # Fondations pures.
    "mumble-server-runtime-protocol",
    "mumble-server-runtime-crypto",
    # Runtime courant : logique de shard sans IO, puis gateway TLS/TCP/UDP.
    "mumble-server-runtime-shard",
    "mumble-server-runtime-gateway",
    # Composition et charge de demonstration.
    "tools/mumble-server-runtime-arena",
    "tools/mumble-server-runtime-stress",
    "tools/bench-shard",
    # Verificateur indépendant : client Mumble simule et modele strict.
    "mumble-server-runtime-testkit",
    # Application Controller : gRPC declaratif compose au-dessus du runtime.
    "integrations/controller/server-rust",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/theking90000/mumble-server-runtime"
authors = ["Mumble Server Runtime contributors"]

# The verifier inherits runtime paths from the workspace so a mechanical crate
# move never requires an implementation diff to edit verifier-owned manifests.
[workspace.dependencies]
mumble-server-runtime-protocol = { path = "mumble-server-runtime-protocol" }
mumble-server-runtime-crypto = { path = "mumble-server-runtime-crypto" }
mumble-server-runtime-shard = { path = "mumble-server-runtime-shard" }
mumble-server-runtime-gateway = { path = "mumble-server-runtime-gateway" }

# Lints partagés — encodent une partie de R4 au niveau du compilateur. Chaque
# crate les active via `[lints] workspace = true`. Le reste de R4 est applique
# par les gates de `ci/`, car clippy ne peut pas l'exprimer.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
# `expect_used` reste autorisé (message explicite) mais surveillé.
expect_used = "warn"
todo = "deny"
unimplemented = "deny"
