[package]
name = "bench-shard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Measures one shard turn: render once, plan once, journal, publish routing, then compose and push to N connections."

[[bin]]
name = "bench-shard"
path = "src/main.rs"

[dependencies]
mumble-server-runtime-shard = { path = "../../runtime/crates/shard" }
mumble-server-runtime-protocol = { path = "../../runtime/crates/protocol" }
tokio = { version = "1", features = ["sync"] }
anyhow = "1"

[lints]
workspace = true
