[package]
name = "mumble-server-runtime-mitm-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Proxy MITM oracle (Phase 2) : termine la TLS des deux côtés, décode/ré-encode chaque message de contrôle et ré-écrit l'échange de clés OCB2 vers un domaine crypto indépendant par bord."

# lib + bin : la logique (state machine crypto, relais framé, TLS) vit dans la
# lib pour être testable en intégration ; le bin n'est qu'un câblage CLI.
[lib]
name = "mumble_server_runtime_mitm_proxy"
path = "src/mumble_server_runtime_mitm_proxy.rs"

[[bin]]
name = "mumble-server-runtime-mitm-proxy"
path = "src/main.rs"

[dependencies]
mumble-server-runtime-protocol = { path = "../../mumble-server-runtime-protocol" }
mumble-server-runtime-crypto = { path = "../../mumble-server-runtime-crypto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
# ring : source d'aléa (SystemRandom) pour la clé/les nonces OCB2 propres au proxy,
# une par session. Déjà présent dans l'arbre via le provider rustls ; crate audité.
ring = "0.17"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# `time` adds the recv timeouts the UDP plane test uses to fail fast instead of
# hanging; `net`/`sync` are already on via [dependencies] (features are unioned).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time"] }
# The T3 done-command replays the real captured corpus through the UDP
# re-encryptor; this reuses the Phase 1 corpus reader/decoder (verification tool).
mumble-server-runtime-corpus-decode = { path = "../corpus-decode" }

[lints]
workspace = true
