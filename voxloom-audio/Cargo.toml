[package]
name = "voxloom-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Routage audio pur (Phase 4) : compilation du snapshot de routage (§15.3), politique directionnelle (§15.4) et réécriture d'enveloppe sortante (§15.2). Sans IO, sans état mutable, sans verrou (ADR-005)."

[lib]
name = "voxloom_audio"
path = "src/voxloom_audio.rs"

[dependencies]
voxloom-protocol = { path = "../voxloom-protocol" }

# criterion only, and only for benches: testing.md requires the router's
# per-packet, per-recipient cost to carry a recorded baseline, and the roadmap
# makes that bench a non-regression gate for Phase 4.
[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "routing"
harness = false

[lints]
workspace = true
