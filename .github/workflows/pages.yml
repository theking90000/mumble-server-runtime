name: Pages

# Publie un seul artefact : le livre mdBook à la racine, la doc rustdoc générée
# sous /api/ et la JavaDoc de Mumble Controller sous /controller/. Le contenu du
# livre y renvoie par des liens relatifs, donc tout doit rester dans le même
# déploiement.
#
# Prérequis côté dépôt : Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un déploiement à la fois, sans annuler celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build book + rustdoc + javadoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Remember Java 8 toolchain
        run: echo "JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            integrations/controller/**/*.gradle.kts
            integrations/controller/gradle/wrapper/gradle-wrapper.properties

      - name: mdbook build
        run: mdbook build

      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features

      - name: Controller JavaDoc
        working-directory: integrations/controller
        run: ./gradlew --no-daemon -Dorg.gradle.java.installations.paths="$JAVA_HOME,$JAVA8_HOME" :sdk-java:javadoc

      - name: Assembler le site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r target/book/. site/
          mkdir -p site/api
          cp -r target/doc/. site/api/
          mkdir -p site/controller
          cp -r integrations/controller/sdk-java/build/docs/javadoc/. site/controller/
          # `cargo doc` sur un workspace multi-crates ne produit pas d'index
          # racine : sans redirection, /api/ renvoie un 404.
          if [ ! -f site/api/index.html ]; then
            cat > site/api/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Mumble Server Runtime API</title>
          <meta http-equiv="refresh" content="0; url=mumble_server_runtime_shard/index.html">
          <a href="mumble_server_runtime_shard/index.html">Mumble Server Runtime API documentation</a>
          HTML
          fi
          test -f site/index.html
          test -f site/api/index.html
          test -f site/controller/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
