name: Pages

# Publie un seul artefact : le livre mdBook à la racine, la doc rustdoc générée
# sous /api/. Le contenu du livre y renvoie par des liens relatifs, donc les deux
# doivent rester dans le même déploiement.
#
# Prérequis côté dépôt : Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un déploiement à la fois, sans annuler celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build book + rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: mdbook build
        run: mdbook build

      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features

      - name: Assembler le site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r target/book/. site/
          mkdir -p site/api
          cp -r target/doc/. site/api/
          # `cargo doc` sur un workspace multi-crates ne produit pas d'index
          # racine : sans redirection, /api/ renvoie un 404.
          if [ ! -f site/api/index.html ]; then
            cat > site/api/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Voxloom API</title>
          <meta http-equiv="refresh" content="0; url=voxloom_shard/index.html">
          <a href="voxloom_shard/index.html">Voxloom API documentation</a>
          HTML
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
