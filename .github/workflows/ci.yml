name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Gates structurels R4 + frontière vérificateur R2. Actifs dès le jour 1,
  # avant toute logique : sur un workspace vide ils passent trivialement.
  gates:
    name: Gates R2/R4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Interdictions structurelles (R4)
        run: ci/gates.sh
      - name: Direction des dépendances (R4)
        run: ci/dep-direction.sh
      - name: Frontière implémenteur/vérificateur (R2)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Actions checks out refs/pull/<n>/merge. Its first parent is the
            # exact PR base, including for stacked PRs where github.base_ref can
            # still resolve to the repository default branch.
            ci/verifier-boundary.sh "HEAD^1"
          else
            ci/verifier-boundary.sh
          fi
      - name: Autotests des gates structurels
        run: ci/structural-gates-self-test.sh

  build:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: ci/cargo-gate.sh cargo fmt --all --check
      - name: clippy
        run: ci/cargo-gate.sh cargo clippy --workspace --all-targets --all-features
      - name: test
        run: ci/cargo-gate.sh cargo test --workspace --all-features
      # Les doc comments sont la doc d'API publiée : un lien intra-doc cassé est
      # une erreur, pas un avertissement.
      - name: rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: ci/cargo-gate.sh cargo doc --workspace --no-deps --all-features

  controller-java:
    name: controller SDK (Java 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Remember Java 8 toolchain
        run: echo "JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: control-plane/**/*.gradle.kts
      - name: SDK build and checks on a Java 8 test runtime
        run: ./gradlew --no-daemon -Dorg.gradle.java.installations.paths="$JAVA_HOME,$JAVA8_HOME" build

  controller-interop:
    name: Controller Java-Rust-Mumble interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Remember Java 8 toolchain
        run: echo "JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: control-plane/**/*.gradle.kts
      - name: Real ControllerSession to Mumble path
        run: ci/controller-interop.sh

  # Le livre est publié depuis main par le workflow Pages. Le construire ici
  # aussi fait échouer la PR plutôt que le déploiement : avec
  # `create-missing = false`, une entrée de SUMMARY.md sans fichier est une
  # erreur de construction.
  book:
    name: mdbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"
      - name: mdbook build
        run: mdbook build
